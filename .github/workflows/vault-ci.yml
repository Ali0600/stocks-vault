name: vault-ci

on:
  push:
  pull_request:
  workflow_dispatch:
# No schedule: the local machine (launchd) is the authoritative refresher and the
# only committer of price/fundamentals refreshes. CI validates push/PR only — it
# never commits, so the two paths can't diverge.

# Least privilege: state what this workflow may touch instead of inheriting whatever the
# repository default happens to be, which is a setting that can change underneath it.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write          # open/append a tracking issue when the gate fails
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test deps
        run: pip install pytest
      - name: Unit tests (linter rules)
        run: pytest scripts/tests -q
      - name: Run vault lint (structural gate)
        run: python scripts/vault_lint.py
      - name: Open a tracking issue if the gate failed
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="CI failing: vault lint/test gate is red"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          num=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -z "$num" ]; then
            gh issue create --title "$title" \
              --body "The \`Lint & test\` job failed on commit \`${GITHUB_SHA}\`. Run: $url"
          else
            gh issue comment "$num" --body "Still failing on \`${GITHUB_SHA}\`. Run: $url"
          fi

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0          # full history scan
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no GITLEAKS_LICENSE: free for a personal public repo
